{% extends "frontend/base.html" %}
{% load i18n %}
{% block title %}400 — quadrum{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;padding:var(--space-6);text-align:center;">
    <div style="font-size:var(--font-size-4xl);font-weight:700;color:var(--color-text-muted);letter-spacing:-0.04em;line-height:1.05;margin-bottom:var(--space-4);">400</div>
    <h1 style="font-size:var(--font-size-2xl);font-weight:600;color:var(--color-text);margin-bottom:var(--space-3);letter-spacing:-0.02em;">{% trans "Invalid request" %}</h1>
    <p style="color:var(--color-text-muted);max-width:420px;line-height:1.6;margin-bottom:var(--space-5);">{% trans "The server could not process this request. Check the submitted data and try again." %}</p>
    <a href="{% url 'frontend:dashboard' %}" class="btn btn-primary" style="text-decoration:none;">{% trans "Back to Dashboard" %}</a>
</div>
{% endblock %}
