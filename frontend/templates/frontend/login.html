{% extends "frontend/base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            <div class="login-logo-icon">C</div>
            <h2 class="login-title">Bem-vindo</h2>
            <p class="login-subtitle">Sistema de Cantina Escolar</p>
        </div>

        <form method="post" action="{% url 'frontend:login' %}" class="login-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" class="input" placeholder="Seu usuário" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" class="input" placeholder="Sua senha" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: var(--space-2);">
                    <path d="M9 16a6 6 0 0 1 6-6V5a2 2 0 1 0-4 0V9a6 6 0 0 1-6 6zM12 3v2m0 12v2m2-2v-2m2 4v-2m-5-4h2m-2 4h2m-7-4h2m4 4H5m3-3H5m3 3h2m-4-4h2m4 4H5m3-3h2m-2-4h2m-2 4h2M4.27 6.97a2.5 2.5 0 1 1 3.54 3.54l-.71-.71a2.5 2.5 0 0 1 0-3.54zM2 9l3.5 3.5M7 7l3 3m3 3l1.29-1.29a2.5 2.5 0 1 1 2.12 2.12L13.5 13H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1z"/>
                </svg>
                Entrar
            </button>
        </form>
    </div>
</div>
{% endblock %}
