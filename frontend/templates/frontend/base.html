<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Cafeteria{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
    <link rel="stylesheet" href="{% static 'css/motion.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
        // Prevent theme flash by setting theme before CSS loads
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="layout">
        {% include "frontend/sidebar.html" %}

        <!-- Header -->
        <header class="header" role="banner">
            <div class="header-left">
                <button class="mobile-menu-btn" aria-label="Open menu" onclick="toggleSidebar()">
                    <i data-lucide="menu" style="width:24px;height:24px;stroke-width:2;"></i>
                </button>

                <form class="search-form" role="search">
                    <div class="search-input-wrapper">
                        <i data-lucide="search" class="search-icon" style="width:16px;height:16px;stroke-width:2;"></i>
                        <input class="search-input" type="search" placeholder="Search products, people, vendas..." aria-label="Search global" id="globalSearchInput">
                    </div>
                </form>
            </div>

            <div class="header-right">
                <div class="theme-toggle">
                    <button id="themeToggle" aria-label="Alternar tema" onclick="toggleTheme()">
                        <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                </div>
                <button class="header-action" aria-label="Notifications" onclick="togglePanel('notificationPanel')">
                    <i data-lucide="bell" style="width:20px;height:20px;stroke-width:2;"></i>
                </button>
                <button class="header-action" aria-label="Messages">
                    <i data-lucide="message-square" style="width:20px;height:20px;stroke-width:2;"></i>
                </button>
                <div class="user-info">
                    <div class="user-avatar">U</div>
                    <div class="user-details">
                        <div class="user-name">User</div>
                        <div class="user-role">Standard</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main" role="main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div class="notification-panel" id="notificationPanel" role="dialog" aria-label="Notifications" style="position:fixed;top:58px;right:16px;width:320px;background:var(--color-bg-elevated);border:1px solid var(--color-border);border-radius:6px;padding:12px;z-index:700;box-shadow:var(--shadow-lg);">
        <div style="font-size:0.75rem;font-weight:600;color:var(--color-text-muted);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px;">Notifications</div>
        <div style="font-size:0.875rem;color:var(--color-text-secondary);">No notifications at this time</div>
    </div>

    <div class="message-panel" id="messagePanel" role="dialog" aria-label="Messages" style="position:fixed;top:58px;right:16px;width:320px;background:var(--color-bg-elevated);border:1px solid var(--color-border);border-radius:6px;padding:12px;z-index:700;box-shadow:var(--shadow-lg);">
        <div style="font-size:0.75rem;font-weight:600;color:var(--color-text-muted);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px;">Messages</div>
        <div style="font-size:0.875rem;color:var(--color-text-secondary);">No messages</div>
    </div>

    <div class="profile-menu" id="profileMenu" role="menu" aria-label="Profile" style="position:fixed;top:58px;right:16px;width:200px;background:var(--color-bg-elevated);border:1px solid var(--color-border);border-radius:6px;padding:8px;z-index:700;box-shadow:var(--shadow-lg);">
        <a href="#" onclick="document.getElementById('profileMenu').classList.remove('open'); return false;" style="display:block;padding:6px 8px;border-radius:4px;color:var(--color-text);font-size:0.875rem;text-decoration:none;">Profile</a>
        <a href="#" onclick="document.getElementById('profileMenu').classList.remove('open'); return false;" style="display:block;padding:6px 8px;border-radius:4px;color:var(--color-text);font-size:0.875rem;text-decoration:none;">Settings</a>
        <div style="border-top:1px solid var(--color-border);margin:4px 0;"></div>
        <a href="{% url 'frontend:login' %}" style="display:block;padding:6px 8px;border-radius:4px;color:var(--color-danger);font-size:0.875rem;text-decoration:none;">Sign out</a>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script src="{% static 'js/main.js' %}"></script>
    <script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>
    {% block extra_js %}{% endblock %}
</body>
</html>
