<!-- Sidebar -->
<aside class="sidebar" id="sidebar" role="navigation" aria-label="Main menu">
    <div class="sidebar-header">
        <a href="{% url 'frontend:dashboard' %}" class="sidebar-logo" aria-label="quadrum">
            <div class="sidebar-logo-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28" fill="none" aria-label="quadrum mark" style="display:block;"><rect x="2" y="2" width="24" height="24" rx="4" stroke="currentColor" stroke-width="2.5" fill="none"/><rect x="10" y="10" width="8" height="8" rx="1" fill="currentColor"/></svg></div>
            <span>quadrum</span>
        </a>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" onclick="toggleSidebarCollapse()" title="Collapse sidebar (Ctrl+B)">
            <i data-lucide="chevron-left" style="width:14px;height:14px;stroke-width:2.5;"></i>
        </button>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
        <div class="nav-section" aria-label="Navigation">
            <div class="nav-section-label">Navigation</div>
            <a href="{% url 'frontend:dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" aria-label="Dashboard" title="Dashboard">
                <i data-lucide="layout-dashboard" style="width:18px;height:18px;stroke-width:2;"></i>
                <span>Dashboard</span>
            </a>
            <a href="{% url 'frontend:vendas_list' %}" class="nav-item {% if request.resolver_match.url_name == 'vendas_list' %}active{% endif %}" aria-label="Sales" title="Sales">
                <i data-lucide="receipt" style="width:18px;height:18px;stroke-width:2;"></i>
                <span>Sales</span>
            </a>
            <a href="{% url 'frontend:pdv' %}" class="nav-item {% if request.resolver_match.url_name == 'pdv' %}active{% endif %}" aria-label="New Sale" title="New Sale">
                <i data-lucide="credit-card" style="width:18px;height:18px;stroke-width:2;"></i>
                <span>New Sale</span>
            </a>
            <a href="{% url 'frontend:produtos' %}" class="nav-item {% if request.resolver_match.url_name == 'produtos' %}active{% endif %}" aria-label="Products" title="Products">
                <i data-lucide="package" style="width:18px;height:18px;stroke-width:2;"></i>
                <span>Products</span>
            </a>
            <a href="{% url 'frontend:estoque' %}" class="nav-item {% if request.resolver_match.url_name == 'estoque' %}active{% endif %}" aria-label="Inventory" title="Inventory">
                <i data-lucide="boxes" style="width:18px;height:18px;stroke-width:2;"></i>
                <span>Inventory</span>
            </a>
            <a href="{% url 'frontend:pessoas' %}" class="nav-item {% if request.resolver_match.url_name == 'pessoas' %}active{% endif %}" aria-label="People" title="People">
                <i data-lucide="users" style="width:18px;height:18px;stroke-width:2;"></i>
                <span>People</span>
            </a>
            <a href="{% url 'frontend:financeiro' %}" class="nav-item {% if request.resolver_match.url_name == 'financeiro' %}active{% endif %}" aria-label="Finance" title="Finance">
                <i data-lucide="banknote" style="width:18px;height:18px;stroke-width:2;"></i>
                <span>Finance</span>
            </a>
            <a href="{% url 'frontend:relatorios' %}" class="nav-item {% if request.resolver_match.url_name == 'relatorios' %}active{% endif %}" aria-label="Reports" title="Reports">
                <i data-lucide="bar-chart-3" style="width:18px;height:18px;stroke-width:2;"></i>
                <span>Reports</span>
            </a>
        </div>
    </nav>

    <div class="sidebar-footer">
        <div class="user-card" onclick="togglePanel('profileMenu')" role="button" aria-label="Profile" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePanel('profileMenu');}">
            <div class="user-avatar">U</div>
            <div class="user-info-text">
                <div class="user-name">User</div>
                <div class="user-role">Standard</div>
            </div>
        </div>
    </div>
</aside>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
